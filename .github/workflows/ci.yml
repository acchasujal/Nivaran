name: Nivaran CI


on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Ensure backend files are writable
        run: chmod -R u+rw backend || true

      - name: Run Backend Tests
        run: |
          cd backend
          export TEST_DATABASE_URL="sqlite:///./test_ci.db"
          python -m pytest

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Frontend (Lint, Typecheck, Test, Build)
        run: |
          cd frontend
          npm run verify

